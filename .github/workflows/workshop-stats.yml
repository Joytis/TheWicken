name: Workshop stats

# Steam has no historical subscriber API -- only a current snapshot -- so this
# samples both Workshop items daily and accumulates the series in the repo.
on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily (best-effort; GitHub may delay or skip)
  workflow_dispatch:
    inputs:
      min_interval_hours:
        description: 'Skip a branch sampled within this many hours (0 = force a sample)'
        default: '12'

permissions:
  contents: write

concurrency:
  group: workshop-stats
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No API key needed -- GetPublishedFileDetails is keyless.
      # 12h guard so a manual dispatch on top of the daily run does not double-sample.
      - name: Poll Steam Workshop
        run: python3 tools/poll_workshop_stats.py --min-interval-hours "${{ inputs.min_interval_hours || '12' }}"

      - name: Commit sample
        run: |
          if git diff --quiet -- Docs/workshop-stats.json; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/workshop-stats.json
          git commit -m "chore: workshop stats sample"
          git push
