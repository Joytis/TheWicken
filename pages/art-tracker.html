<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Witch — Art Tracker</title>
<style>
  :root{
    --bg:#15131c; --panel:#1f1b2b; --panel2:#272234; --line:#3a3350;
    --ink:#e9e4f5; --muted:#a99fc4; --gold:#e0b24a; --accent:#9d7bff;
    --ok:#46c476; --warn:#e0b24a; --no:#5b5470;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  h1{margin:0 0 4px;font-size:20px;color:var(--gold);letter-spacing:.5px}
  .sub{color:var(--muted);font-size:12px}
  .tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:7px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;font-weight:600;user-select:none}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:6px;min-width:220px;font-size:13px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:14px;cursor:pointer;font-size:12px;user-select:none}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .prog{margin-left:auto;color:var(--muted);font-size:12px;text-align:right}
  .bar{width:180px;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
  .bar > i{display:block;height:100%;background:var(--ok);width:0}
  main{padding:14px 22px 60px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--panel);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  tbody tr:hover{background:var(--panel2)}
  .name{font-weight:600}
  .meta{color:var(--muted);font-size:12px;white-space:nowrap}
  .text{max-width:340px}
  .brief{max-width:420px;color:#b9a8e6;font-style:italic;font-size:12px}
  .dims{font:11px/1.4 ui-monospace,Consolas,monospace;color:var(--muted)}
  .pathcell{font:10px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);max-width:220px;word-break:break-all}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
  .s-done{background:#46c47633;color:#5fe09a}
  .s-inprogress{background:#c9a82a33;color:#e6cf5a}
  .s-placeholder{background:#5b547033;color:#9b93b3}
  .artist{color:#8ec2ee;font-size:12px;white-space:nowrap}
  .thumb{width:60px}
  .thumb img{width:52px;height:auto;border-radius:4px;border:1px solid var(--line);background:#0d0b14;display:block;cursor:zoom-in}
  .thumb .none{width:52px;height:40px;border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--no);font-size:10px}
  #lightbox{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
  #lightbox img{max-width:88vw;max-height:88vh;border-radius:8px;border:1px solid var(--line)}
  .catnote{color:var(--muted);font-size:12px;margin:8px 0 12px}
</style>
</head>

const DATA = {"generated":"2026-07-24","cards":[{"name":"Defend","artist":"","status":"Placeholder","brief":"This is our base defend card. There will be 5 in every starting deck. - it should depict the witch in a relatively neutral state without upgrades, simply blocking. See other blocks for inspiration - they typically depict the character in portrait holding some sort of equipment while rebuffing streaks of light.","type":"Skill","rarity":"Starter","cost":"1","text":"Gain 5 Block.","upgrade":"Block +3","mechanics":"","path":"TheWitch/images/card_portraits/big/defend_witch.png","dims":"1000x760","hasArt":true},{"name":"Harvest","artist":"","status":"Placeholder","brief":"","type":"Attack","rarity":"Starter","cost":"2","text":"Deal 12 damage. Harvest a Potion.","upgrade":"Damage +4","mechanics":"Potions","path":"TheWitch/images/card_portraits/big/harvest.png","dims":"1000x760","hasArt":true},{"name":"Strike","artist":"Phenelia","status":"Done","brief":"This is our base base strike card. There will be 5 in every starting deck. Strikes. Strikes typically depict the 'basic' weapon of the character. For the witch, this will likely be vicious, extended claws.","type":"Attack","rarity":"Starter","cost":"1","text":"Deal 6 damage.","upgrade":"Damage +3","mechanics":"","path":"TheWitch/images/card_portraits/big/strike_witch.png","dims":"1000x760","hasArt":true},{"name":"Bag of Teeth","artist":"Bobby Hessler","status":"In Progress","brief":"A bag of teeth! This will be a common payoff to 'big strength' and 'big vigor 'strategies. Should depict either teeth being thrown at an enemy (a little more difficult to read the 'teeth' in) or a bag overflowing with teeth.","type":"Attack","rarity":"Common","cost":"1","text":"Deal 2 damage 4 times.","upgrade":"Repeat +1","mechanics":"Debuff/Buff","path":"TheWitch/images/card_portraits/big/bag_of_teeth.png","dims":"1000x760","hasArt":true},{"name":"Bewitching Grin","artist":"","status":"Placeholder","brief":"A sinister, evil grin with sparkling eyes. Feel free to be evil! This will be an 'intimidation'-themed defensive tool.","type":"Skill","rarity":"Common","cost":"1","text":"Gain 5 Block. Apply 1 Weak to ALL enemies.","upgrade":"Weak +1","mechanics":"Debuff/Buff","path":"TheWitch/images/card_portraits/big/bewitching_grin.png","dims":"1000x760","hasArt":true},{"name":"Big Batch","artist":"","status":"Placeholder","brief":"'Potions' are a strong theme in the card set. This common card will serve as a consistent generator. It should depict either a bottling process of two Noxious Brews, or the action process of creating a large quantity of potions.","type":"Skill","rarity":"Common","cost":"2","text":"Create Brews Noxious Brews.","upgrade":"Brews +1","mechanics":"Potions","path":"TheWitch/images/card_portraits/big/big_batch.png","dims":"1000x760","hasArt":true},{"name":"Broom Strike","artist":"","status":"Placeholder","brief":"A broom brought down from on high, sweeping enemies away, can depict either scampering mice, or one of the smaller common slay the spire enemies being dispersed. The card itself is not a synergy piece for a large theme, and more a glue card for other decks.","type":"Attack","rarity":"Common","cost":"1","text":"Deal 6 damage. Your next Skill costs 1 less.","upgrade":"Damage +3","mechanics":"","path":"TheWitch/images/card_portraits/big/broom_strike.png","dims":"1000x760","hasArt":true},{"name":"Call the Pack","artist":"","status":"Placeholder","brief":"Familiars ended up having a 'Wolf' sub-archetype, decks focused on generating as many 'Gnash' cards as possible. See Gnash for thematic details. This is a common include for the 'Wolf' deck. It should depict the witch calling a pack of wolves.","type":"Skill","rarity":"Common","cost":"1","text":"Gain 6 Block. Shuffle 2 Gnash into your Draw Pile.","upgrade":"Block +3, Cards +1","mechanics":"Familiars","path":"TheWitch/images/card_portraits/big/call_the_pack.png","dims":"1000x760","hasArt":true},{"name":"Fertilize","artist":"","status":"Placeholder","brief":"This is a nice glue piece for the Brambles archetype. It should depict nurtured, actively growing, and thorny plants. The plants themselves can either be sinister or tame, but should depict the thorny themes of brambles.","type":"Skill","rarity":"Common","cost":"1","text":"Gain 5 Brambles. Next turn, gain {EnergyNextTurnPower:energyIcons()}.","upgrade":"Brambles +1, EnergyNextTurn +1","mechanics":"Brambles","path":"TheWitch/images/card_portraits/big/fertilize.png","dims":"1000x760","hasArt":true},{"name":"Forbidden Magic","artist":"","status":"Placeholder","brief":"The witch casts a devious spell, sacrificing some of their own power to wallop the enemy with magic. The spell should feel devastating, but the witch should be distressed by casting it.","type":"Attack","rarity":"Common","cost":"1","text":"Deal 15 damage. Gain 2 Weak.","upgrade":"Damage +5","mechanics":"","path":"TheWitch/images/card_portraits/big/forbidden_magic.png","dims":"1000x760","hasArt":true},{"name":"Herbal Brew","artist":"","status":"Placeholder","brief":"One of the Common Brew trio. This will create a common, valuable utility potion for the player. These potions can draw cards, reduce mana cost, generally any action not directly related to offense or defense. It should feel herbal, mysterious, fluid. Depicts full focus on a single potion bottle.","type":"Skill","rarity":"Common","cost":"energyCost","text":"Create a utility Potion.","upgrade":"none","mechanics":"Potions","path":"TheWitch/images/card_portraits/big/herbal_brew.png","dims":"1000x760","hasArt":true},{"name":"Hide in a Bush","artist":"","status":"Placeholder","brief":"Depicts the witch hiding in a bush. The thematics on this one can be a bit silly if desired. This is a main defensive card for the 'Brambles' archetype, so please make sure the the bush is thorny!","type":"Skill","rarity":"Common","cost":"1","text":"Gain 6 Block. Gain 3 Brambles.","upgrade":"Block +2, Brambles +1","mechanics":"Brambles","path":"TheWitch/images/card_portraits/big/hide_in_a_bush.png","dims":"1000x760","hasArt":true},{"name":"Lavender and Sage","artist":"","status":"Placeholder","brief":"Depicts garlands of lavender and sage, bundles of the two, thorns strung into the mix. This card should be a bit more peaceful, therapeutic, calming, but prickly!","type":"Skill","rarity":"Common","cost":"1","text":"Draw 2 cards. Gain 3 Brambles.","upgrade":"Brambles +2","mechanics":"Brambles","path":"TheWitch/images/card_portraits/big/lavender_and_sage.png","dims":"1000x760","hasArt":true},{"name":"Needle Whip","artist":"","status":"Placeholder","brief":"The placeholder depiction is quite strong here - an evil, lashing whip of thorns, berries still attached to the brambles. This can either depict the weapon itself or the action of hitting an enemy, though weapon focus gives a much more clear read on the thorns and berries at a distance.","type":"Attack","rarity":"Common","cost":"1","text":"Deal 9 damage. Gain 3 Brambles.","upgrade":"Brambles +3","mechanics":"Brambles","path":"TheWitch/images/card_portraits/big/needle_whip.png","dims":"1000x760","hasArt":true},{"name":"Pact of Agony","artist":"","status":"Placeholder","brief":"The witch stabs/slices a portion of their body, blood rushing out in a nova, cutting enemies in turn. String themes of 'paying the cost' for heavy damage.","type":"Attack","rarity":"Common","cost":"1","text":"Deal 12 damage to ALL enemies. Add 1 Wound to your Discard Pile.","upgrade":"Damage +5","mechanics":"","path":"TheWitch/images/card_portraits/big/pact_of_agony.png","dims":"1000x760","hasArt":true},{"name":"Pocket Rats","artist":"","status":"Placeholder","brief":"","type":"Attack","rarity":"Common","cost":"2","text":"Deal 5 damage. Add 2 Rats into your Hand.","upgrade":"Cards +1","mechanics":"Familiars","path":"TheWitch/images/card_portraits/big/pocket_rats.png","dims":"1000x760","hasArt":true},{"name":"Read the Bones","artist":"","status":"Placeholder","brief":"Carved bones lay on the tray, inlays glowing a soft purple as they speak sinister intent. Potential: eyes glow faintly in the background, or a claw sneaks towards the bones to inspect them.","type":"Skill","rarity":"Common","cost":"1","text":"Apply 2 Hex. Next turn, gain 6 Block.","upgrade":"BlockNextTurn +2","mechanics":"Debuff/Buff","path":"TheWitch/images/card_portraits/big/read_the_bones.png","dims":"1000x760","hasArt":true},{"name":"Stony Brew","artist":"","status":"Placeholder","brief":"One of the Common Brew trio. This will create a common defensive potion for the player. These potions create block, give dexterity, and general create 'safety. The bottle should feel sturdy, steadfest, and the liquid could even feel a bit thick. if you drink this potion, you'll definitely be healthy.","type":"Skill","rarity":"Common","cost":"energyCost","text":"Create a defensive Potion.","upgrade":"none","mechanics":"Potions","path":"TheWitch/images/card_portraits/big/stony_brew.png","dims":"1000x760","hasArt":true},{"name":"Tinder","artist":"","status":"Placeholder","brief":"A Small bundle of sticks and twigs ignite - the witch has spent a bit of their own growth to feed the flames.","type":"Skill","rarity":"Common","cost":"0","text":"Lose 1 Brambles. Gain 1.","upgrade":"Energy +1","mechanics":"Brambles","path":"TheWitch/images/card_portraits/big/tinder.png","dims":"1000x760","hasArt":true},{"name":"Trash Diving","artist":"","status":"Placeholder","brief":"","type":"Skill","rarity":"Common","cost":"1","text":"Put a card from your Discard Pile into your Hand. Add a Rats into your Hand.","upgrade":"custom (see code)","mechanics":"Familiars","path":"TheWitch/images/card_portraits/big/trash_diving.png","dims":"1000x760","hasArt":true},{"name":"Vexing Strike","artist":"","status":"Placeholder","brief":"A slashing claw, fingertips trailing purple. Hexes are sinister, so feel free to play with carved spells or blood.","type":"Attack","rarity":"Common","cost":"1","text":"Deal 8 damage. Apply 1 Hex.","upgrade":"Hex +1","mechanics":"Debuff/Buff","path":"TheWitch/images/card_portraits/big/vexing_strike.png","dims":"1000x760","hasArt":true},{"name":"Weathered Witch Hat","artist":"","status":"Placeholder","brief":"Depiction of a big, worn, patchy witch hat. It should feel comfortable, old, reverent with years of experience. Can be depict either in a peaceful sunlit room, or actively worn by the witch herself.","type":"Skill","rarity":"Common","cost":"2","text":"Gain 10 Block. Play a random Skill from your Draw Pile.","upgrade":"Block +3","mechanics":"","path":"TheWitch/images/card_portraits/big/weathered_witch_hat.png","dims":"1000x760","hasArt":true},{"name":"Wicked Brew","artist":"KaiThePhaux","status":"In Progress","brief":"One of the Common Brew trio. This will create a common offensive potion for the player. These potions create attacks, grant strength, and damage enemies. The bottle should feel volatile, aggressive, and even a bit evil. if you use this potion, someone will get hurt.","type":"Skill","rarity":"Common","cost":"energyCost","text":"Create an offensive Potion.","upgrade":"none","mechanics":"Potions","path":"TheWitch/images/card_portraits/big/wicked_brew.png","dims":"1000x760","hasArt":true},{"name":"Bear Familiar","artist":"","status":"Placeholder","brief":"Familiar. Associated Cards: Hibernate, Mutilate. \nA big ole bear! It should feel sturdy, difficult to move, big trying to do so would probably be a bad idea. Thematically, players will pick this bear when they want a generally solid set of cards which don't synergize with other strategies. Big, beefy value cards.","type":"Power","rarity":"Uncommon","cost":"1","text":"Summon a Bear Familiar.","upgrade":"none","mechanics":"Familiars","path":"TheWitch/images/card_portraits/big/bear_familiar.png","dims":"1000x760","hasArt":true},{"name":"Bind in Blood","artist":"","status":"Placeholder","brief":"Another 'pay the price' card - depiction of a cost being paid (contract, sacrifice, signature), and purple /big/cloak_of_moonlight.png","dims":"1000x760","hasArt":true},{"name":"Command","artist":"","status":"Placeholder","brief":"","type":"Attack","rarity":"Uncommon","cost":"0","text":"Deal 3 damage. One of your Familiars creates a card.","upgrade":"Damage +3","mechanics":"Familiars","path":"TheWitch/images/card_portraits/big/command.png","dims":"1000x760","hasArt":true},{"name":"Creeping Vines","artist":"","status":"Placeholder","brief":"Thorns and vibes seep into a creature, pulling them into the thicket. This could be a creature, the witch herself, or a familiar.","type":"Skill","rarity":"Uncommon","cost":"X","text":"Gain 7 Brambles X times.","upgrade":"Brambles +2","mechanics":"Brambles","path":"TheWitch/images/card_portraits/big/creeping_vines.png","dims":"1000x760","hasArt":true},{"name":"Crow Familiar","artist":"","status":"Placeholder","brief":"","type":"Power","rarity":"Uncommon","cost":"1","text":"Summon a Crow Familiar.","upgrade":"none","mechanics":"Familiars","path":"TheWitch/images/card_portraits/big/crow_familiar.png","dims":"1000x760","hasArt":true},{"name":"Deep Roots","artist":"","status":"Placeholder","brief":"General themes of growth, thickets, brambles, or roots piercing into the earth. This is a generator card which consistently enables the brambles synergy.","type":"Power","rarity":"Uncommon","cost":"1","text":"At the start of your turn, gain 3 Brambles.","upgrade":"DeepRoots +2","mechanics":"Brambles","path":"TheWitch/images/card_portraits/big/deep_roots.png","dims":"1000x760","hasArt":true},{"name":"Eye of Newt","artist":"","status":"Placeholder","brief":"Should depict the witch adding additional ingredients to their potions, making them more powerful, more evil! Doesn't necessarily need to be an eye of newt added to a potion.","type":"Power","rarity":"Uncommon","cost":"1","text":"Your Potions deal double damage.","upgrade":"EyeOfNewt +1","mechanics":"Potions","path":"TheWitch/images/card_portraits/big/eye_of_newt.png","dims":"1000x760","hasArt" const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scls = s => 's-' + s.toLowerCase().replace(/\s+/g,'');
// tabs: cards + each asset category
const TABS = [{id:'cards', title:'Cards'}].concat(DATA.categories.map(c=>({id:c.id,title:c.title})));
let tab = 'cards', filter = 'all', q = '';

function rows() {
  if (tab === 'cards') return DATA.cards;
  return DATA.categories.find(c=>c.id===tab).assets;
}
function render() {
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.t===tab));
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.dataset.f===filter));
  const all = rows();
  const shown = all.filter(r =>
    (filter==='all' || r.status===filter) &&
    (!q || (r.name + ' ' + (r.text||r.effect||'') + ' ' + (r.brief||'') + ' ' + (r.artist||'')).toLowerCase().includes(q)));
  const fin = all.filter(r=>r.status==='Done').length;
  document.getElementById('progtext').textContent = fin + ' / ' + all.length + ' done';
  document.getElementById('progbar').style.width = (all.length ? 100*fin/all.length : 0) + '%';

  const isCards = tab === 'cards';
  const cat = isCards ? null : DATA.categories.find(c=>c.id===tab);
  let h = '';
  if (cat && cat.dims) h += '<div class="catnote">Required dimensions: ' + esc(cat.dims) + '</div>';
  h += '<table><thead><tr><th></th><th>Status</th><th>Artist</th><th>Art Brief</th><th>Name</th>';
  h += isCards ? '<th>Type</th><th>Rarity</th><th>Cost</th><th>Card Text</th><th>Upgrade</th><th>Mechanics</th>'
               : '<th>Details</th>' + (cat.assets.some(a=>a.rarity)?'<th>Rarity</th>':'') + (cat.assets.some(a=>a.orientation)?'<th>Orientation</th>':'');
  h += '<th>Required Dims</th><th>Filename</th></tr></thead><tbody>';
  for (const r of shown) {
    h += '<tr>';
    h += '<td class="thumb">' + (r.hasArt
      ? '<img loading="lazy" src="../' + esc(r.path) + '" alt="" title="click to enlarge">'
      : '<div class="none">no art</div>') + '</td>';
    h += '<td><span class="badge ' + scls(r.status) + '">' + esc(r.status) + '</span></td>';
    h += '<td class="artist">' + esc(r.artist || '—') + '</td>';
    h += '<td class="brief">' + esc(r.brief) + '</td>';
    h += '<td class="name">' + esc(r.name) + '</td>';
    if (isCards) {
      h += '<td class="meta">' + esc(r.type) + '</td><td class="meta">' + esc(r.rarity) + '</td><td class="meta">' + esc(r.cost) + '</td>';
      h += '<td class="text">' + esc(r.text) + '</td><td class="meta">' + esc(r.upgrade) + '</td><td class="meta">' + esc(r.mechanics) + '</td>';
    } else {
      h += '<td class="text">' + esc(r.effect) + '</td>';
      if (cat.assets.some(a=>a.rarity)) h += '<td class="meta">' + esc(r.rarity) + '</td>';
      if (cat.assets.some(a=>a.orientation)) h += '<td class="meta">' + esc(r.orientation) + '</td>';
    }
    h += '<td class="dims">' + esc(r.dims) + '</td>';
    h += '<td class="pathcell">' + esc(r.path ? r.path.split('/').pop() : '—') + '</td>';
    h += '</tr>';
  }
  h += '</tbody></table>';
  document.getElementById('main').innerHTML = h;
}
const tabsEl = document.getElementById('tabs');
tabsEl.innerHTML = TABS.map(t=>'<span class="tab" data-t="'+t.id+'">'+esc(t.title)+'</span>').join('');
tabsEl.addEventListener('click', e => { const t=e.target.closest('.tab'); if(t){tab=t.dataset.t; render();} });
document.querySelector('.controls').addEventListener('click', e => { const c=e.target.closest('.chip'); if(c){filter=c.dataset.f; render();} });
document.getElementById('q').addEventListener('input', e => { q=e.target.value.toLowerCase(); render(); });
const lb = document.getElementById('lightbox');
document.getElementById('main').addEventListener('click', e => {
  const img = e.target.closest('.thumb img');
  if (img) { lb.querySelector('img').src = img.src; lb.style.display='flex'; }
});
lb.addEventListener('click', () => lb.style.display='none');
render();
</script>
